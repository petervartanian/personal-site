/* Shared interface rules adapted from Correlator and Monitor at GitHub commit
   4f63a24d6aad466e8dbba1fc5c6c889eacf0ad81. Compact sector mosaic and
   dark multicolour masthead revised 4 October 2026. */
:root {
  --brand: #405474;
  --header: #18212b;
  --ink: #252a28;
  --muted: #5f6763;
  --line: #dce1dd;
  --paper: #fff;
  --wash: #f5f6f5;
  --control-border: #8d958f;
  font-synthesis: none;
}
body { min-width: 320px; background: var(--paper); }
* { letter-spacing: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-weight: 650; line-height: 1.25; letter-spacing: 0; }
h1 { font-size: 30px; margin-bottom: 10px; }
h2 { font-size: 21px; }
h3 { font-size: 18px; }
button, .button { min-height: 36px; padding: 7px 14px; border: 1px solid var(--control-border); border-radius: 2px; font-size: 13px; font-weight: 500; }
button:hover, .button:hover { background: var(--wash); border-color: var(--ink); }
button.primary, .button.primary { color: white; border-color: var(--brand); background: var(--brand); }
button.primary:hover { background: var(--dark); }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }
input, select, textarea { border: 1px solid var(--control-border); border-radius: 2px; padding: 8px 12px; min-height: 40px; }
label { font-size: 12px; font-weight: 500; color: var(--muted); }
label input, label select, label textarea { font-size: 14px; }
.site-header { background: var(--header); color: #fff; border-bottom: 1px solid var(--header); }
.header-inner { max-width: 1280px; min-height: 84px; margin: auto; padding: 0 40px; display: flex; align-items: center; gap: 28px; }
.partner-logos { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.partner-mark { height: 60px; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
.partner-mark img { display: block; width: 124px; height: 36px; object-fit: contain; }
.partner-mark.keythorn-mark { gap: 7px; padding-left: 10px; color: #fff; font-size: 18px; font-weight: 500; }
.partner-mark.keythorn-mark:hover { text-decoration: none; }
.partner-mark .brand-mark { width: 30px; height: 36px; }
.partner-mark .brand-mark img { width: 30px; height: 32px; }
.brand { color: #fff; flex: 1; min-width: 136px; font-weight: 650; }
.brand:hover { text-decoration: none; }
.app-name { font-size: 20px; font-weight: 650; line-height: 1.2; }
#navigation.main-nav { background: none; border-radius: 0; padding: 0; display: flex; align-items: center; gap: 24px; flex-shrink: 0; align-self: stretch; }
#navigation.main-nav a { display: flex; align-items: center; min-height: 52px; padding: 18px 0; color: #ffffffc9; font-size: 14px; font-weight: 500; border-radius: 0; border-bottom: 2px solid transparent; }
#navigation.main-nav a:hover, #navigation.main-nav a[aria-current=page] { color: #fff; background: none; border-bottom-color: #fff; text-decoration: none; }
.site-header a:focus-visible { outline-color: #fff; }
main.main-content { width: 100%; max-width: 1280px; margin: auto; padding: 32px 40px 56px; min-width: 0; }
.page-heading { margin-bottom: 28px; gap: 30px; }
.page-heading p { font-size: 15px; color: var(--muted); }
.toolbar { border: 0; border-radius: 0; padding: 0; gap: 20px; margin-bottom: 0; background: transparent; }
.mosaic-caption { margin: 18px 0 10px; font-size: 12px; }
.shade-select { max-width: 450px; }
.source-note { color: var(--muted); font-size: 12px; }
.eyebrow { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 500; }
.table-scroll { border: 0; border-radius: 0; }

/* A continuous, compact tessellation preserves the sector palette and icons. */

.ac-atlas-map .ac-atlas-region { position: absolute; left: var(--desktop-left); top: var(--desktop-top); width: var(--desktop-width); height: var(--desktop-height); clip-path: var(--desktop-clip); min-width: 0; min-height: 0; border: 0; border-radius: 0; padding: 0; background: var(--sector-tint); color: var(--sector-color); cursor: pointer; text-align: center; transition: filter .15s, opacity .15s; }

.ac-atlas-region-label { position: absolute; width: 73%; height: auto; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font: 550 13px/1.22 Figtree,Arial,sans-serif; }

.ac-atlas-map .ac-atlas-region:focus-visible { outline: none; filter: brightness(.82); }

/* Main chapters follow the current published guide; references remain utilities. */

  border-bottom: 0;
}

.decision-section > h3, .decision-section > .section-head h3 { margin: 0 0 18px; font-size: 20px; }
.decision-section p { max-width: 880px; line-height: 1.7; }
.decision-section h4 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
.decision-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-width: 1050px; }
.decision-case { margin: 20px 0; max-width: 950px; padding-top: 18px; border-top: 1px solid var(--line); }
.decision-case h4 { font-size: 18px; }
.decision-case h4 a { color: var(--ink); }
.decision-case .section-head { margin-bottom: 10px; }
.decision-case .section-head > span { color: var(--muted); font-size: 11px; }
.decision-amount { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.decision-amount span { font-size: 12px; color: var(--muted); }
.decision-source-links { font-size: 12px; }
.decision-controls { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 28px; }
.decision-control { padding-top: 18px; border-top: 1px solid var(--line); }
.decision-control p { font-size: 14px; }
.decision-control details { font-size: 12px; color: var(--muted); }
.decision-control details summary { cursor: pointer; }
.decision-priorities { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 26px; }
.decision-priority { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-content: start; }
.decision-priority a { font-size: 14px; color: var(--ink); }
.decision-priority strong { font-size: 15px; font-weight: 550; }
.decision-priority small { grid-column: 1/-1; color: var(--muted); font-size: 11px; }
.decision-priority-bar { grid-column: 1/-1; background: #edf0f3; height: 5px; }
.decision-priority-bar > span { display: block; height: 100%; background: var(--brand); }
.decision-discovery { margin: 24px 0; padding: 14px 0; }
.decision-discovery > summary { cursor: pointer; font-weight: 600; font-size: 16px; }
@media(min-width:651px) and (max-width:1000px) {
 .priority-mosaic { height: 310px; }
 .priority-mosaic .ac-atlas-region { left: var(--tablet-left); top: var(--tablet-top); width: var(--tablet-width); height: var(--tablet-height); clip-path: var(--tablet-clip); }
 .priority-mosaic .ac-atlas-region-label { left: var(--tablet-labelX); top: var(--tablet-labelY); width: var(--tablet-labelWidth); height: var(--tablet-labelHeight); }
 .header-inner { padding-left: 28px; padding-right: 28px; gap: 18px; }
 .app-name { font-size: 19px; }
 .decision-readout { padding: 18px; }
}
@media(max-width:650px) {
 .header-inner { flex-wrap: wrap; padding: 10px 20px 0; gap: 0 14px; min-height: 88px; }
 .brand { text-align: right; min-width: 80px; }
 #reference-navigation { width: 100%; justify-content: flex-end; }
 .header-evidence { font-size: 11px; }
 .header-evidence summary { padding: 4px 0 10px; }
 .question-intro h1 { font-size: 26px; }
 .question-context { gap: 8px 18px; }
 .explorer-heading { align-items: stretch; flex-direction: column; gap: 12px; }
 .sector-find { width: 100%; }
 .priority-mosaic { height: 560px; }
 .priority-mosaic .ac-atlas-region { left: var(--mobile-left); top: var(--mobile-top); width: var(--mobile-width); height: var(--mobile-height); clip-path: var(--mobile-clip); }
 .priority-mosaic .ac-atlas-region-label { left: var(--mobile-labelX); top: var(--mobile-labelY); width: var(--mobile-labelWidth); height: var(--mobile-labelHeight); }
 .mosaic-footer { flex-direction: column; gap: 6px; }
 .workspace-jobs { flex-direction: column; align-items: stretch; gap: 12px; }
 .job-options button { flex: 1; }
 .decision-profile-header { align-items: start; gap: 12px; }
 .decision-profile-header h2 { font-size: 23px; }
 .decision-profile-header button { font-size: 11px; padding: 7px 9px; }
 .decision-readouts { grid-template-columns: 1fr; }
 .decision-readout { padding: 16px 18px; }
 .decision-readout + .decision-readout { border-left: 0; border-top: 1px solid var(--line); }
 .decision-comparison, .decision-controls, .decision-priorities { grid-template-columns: 1fr; gap: 18px; }
 .decision-case .section-head { align-items: start; flex-direction: column; gap: 5px; }
}
@media(max-width:360px) {
 .priority-mosaic { height: 620px; }
 .app-name { font-size: 16px; }
}
@media print {
 .decision-explorer, .question-context, .decision-profile-header button { display: none; }
 .decision-discovery { display: none; }
 .decision-readouts { grid-template-columns: repeat(3,1fr); }
 .decision-control, .decision-case { break-inside: avoid; }
}

/* Task comparisons and incident investigations share one compact workspace. */
#decision-answer { scroll-margin-top: 22px; }
#decision-answer:focus { outline: none; }
.evidence-workflow-heading { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:22px; }
.evidence-workflow-heading .eyebrow { margin:0 0 5px; font-size:10px; letter-spacing:.1em; }
.evidence-workflow-heading h2 { margin:0; font-size:26px; }
.evidence-board { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr); border:1px solid var(--line); }
.evidence-board > section { margin:0; padding:25px 28px; min-width:0; }
.evidence-mit { background:#f7f8fa; border-left:1px solid var(--line); padding:25px 24px; min-width:0; }
.evidence-mit > .eyebrow { margin:0 0 15px; }
.evidence-options { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0; }
.evidence-options button { background:#fff; border:1px solid #dce0e5; color:var(--ink); font-size:12px; padding:7px 10px; min-height:33px; text-align:left; }
.evidence-options button[aria-pressed=true] { background:#263d59; border-color:#263d59; color:white; }
.risk-options { flex-direction:column; margin-top:0; }
.risk-options button { border:0; border-left:3px solid transparent; border-radius:0; background:transparent; padding:9px 10px; line-height:1.4; }
.risk-options button[aria-pressed=true] { background:#e9edf3; color:#19344f; border-color:#416482; }
.mit-context-values { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:25px 0 16px; }
.mit-context-values strong { display:block; font-size:25px; font-weight:500; }
.mit-context-values span { display:block; font-size:11px; color:var(--muted); line-height:1.5; margin-top:6px; }
.evidence-mit > a { font-size:12px; }
.study-setting { font-size:11px; color:var(--muted); margin:0 0 9px; }
.comparison-study h3 { font-size:22px; font-weight:550; line-height:1.4; margin:0 0 18px; }
.metric-options { margin:18px 0 8px; }
.chart-unit { font-size:11px; color:var(--muted); margin:14px 0; }
.comparison-chart { display:grid; gap:17px; margin-bottom:18px; }
.arm-label { display:flex; align-items:baseline; justify-content:space-between; gap:15px; font-size:13px; margin-bottom:7px; }
.arm-label strong { font-size:19px; font-weight:550; font-variant-numeric:tabular-nums; }
.arm-track { background:#eff1f4; height:12px; }
.arm-fill { display:block; background:#6283ab; height:100%; }
.arm-human { background:#8894a2; }
.arm-ai-led { background:#bc849d; }
.comparison-arm small { display:block; color:var(--muted); font-size:10px; margin-top:5px; }
.evidence-footnote { font-size:11px; line-height:1.6; color:var(--muted); margin:10px 0; }
.study-boundary { margin-top:20px; padding:15px 17px; border-left:3px solid #6f94ad; background:#f4f7fa; }
.study-boundary strong { font-size:12px; font-weight:600; }
.study-boundary p { font-size:13px; line-height:1.6; margin:8px 0 0; }
.evidence-source { font-size:11px; line-height:1.6; margin:14px 0 0; }
.workflow-next { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:20px 0; }
.workflow-next > span { color:var(--muted); font-size:12px; }
.workflow-next button { flex-shrink:0; }
.effect-value strong { display:block; font-size:36px; font-variant-numeric:tabular-nums; font-weight:500; }
.effect-value span, .effect-value small { display:block; color:var(--muted); font-size:13px; margin:5px 0; }
.comparison-empty > p { line-height:1.65; font-size:14px; }
.investigation-board h3 { font-size:21px; line-height:1.35; margin:0 0 15px; }
.investigation-board h4 { font-size:15px; line-height:1.4; }
.investigation-board p { line-height:1.65; font-size:13px; }
.investigation-board .source-note, .investigation-board .evidence-footnote { font-size:11px; }
.investigation-board blockquote { margin:12px 0; padding:10px 14px; border-left:2px solid #c8d3df; font-size:13px; background:#f7f8fa; }
.risk-source-layout { display:grid; grid-template-columns:280px minmax(0,1fr); gap:28px; border:1px solid var(--line); }
.risk-source-layout nav { display:flex; flex-direction:column; max-height:420px; overflow:auto; background:#f5f7fa; padding:10px; }
.risk-source-layout nav a { color:var(--ink); font-size:12px; line-height:1.5; padding:10px; text-decoration:none; border-left:3px solid transparent; }
.risk-source-layout nav a[aria-current=true] { border-color:#52769a; background:#e4ebf3; }
.risk-source-layout nav small { display:block; color:var(--muted); }
.risk-source-layout article { padding:23px 25px 23px 0; min-width:0; }
.risk-source-layout h3 { font-size:19px; }
.risk-source-layout p,.risk-source-layout blockquote { font-size:13px; line-height:1.65; overflow-wrap:anywhere; }
.risk-source-layout blockquote { padding:12px 15px; margin:16px 0; background:#f7f8fa; border-left:3px solid #b7c7d7; }
.risk-source-layout cite { display:block; font-size:11px; margin-top:8px; font-style:normal; color:var(--muted); }
.source-study { border-bottom:1px solid var(--line); padding-bottom:18px; }
@media(max-width:800px) {
 .evidence-board { grid-template-columns:minmax(0,1fr); }
 .evidence-mit { border-left:0; border-top:1px solid var(--line); }
 .risk-options { flex-direction:row; }
 .risk-options button { flex:1; min-width:130px; }
 .risk-source-layout { grid-template-columns:1fr; gap:0; }
 .risk-source-layout nav { max-height:180px; }
 .risk-source-layout article { padding:20px; }
}
@media(max-width:650px) {
 #reference-navigation { padding:8px 0; }
 #reference-navigation a { font-size:11px; }
 .evidence-board > section, .evidence-mit { padding:18px; }
 .evidence-workflow-heading h2 { font-size:23px; }
 .evidence-workflow-heading > button { max-width:120px; font-size:11px; }
 .comparison-study h3 { font-size:19px; }
 .workflow-next { align-items:stretch; flex-direction:column; gap:12px; }
 .workflow-next button { align-self:flex-start; }
 .arm-label { font-size:12px; }
 .arm-label strong { font-size:17px; }
}
.skip-link:not(:focus) { clip-path: inset(50%); }

.delegation-formula { margin:23px 0 22px; padding:17px 20px 14px; border:1px solid #d9e0e6; border-left:3px solid #607d94; background:linear-gradient(115deg,#f4f8fa,#fbf8fa); }
.formula-heading { display:flex; align-items:center; justify-content:space-between; gap:15px; }
.formula-heading h2 { margin:0; font-size:12px; font-weight:600; letter-spacing:.04em; }
.formula-heading a { font-size:11px; }
.formula-expression { display:flex; justify-content:center; margin:15px 0 13px; }
.cost-fraction { display:inline-flex; flex-direction:column; text-align:center; font-size:23px; line-height:1.35; color:#293d50; }
.cost-fraction > span { padding:5px 17px; }
.cost-fraction > span + span { border-top:1px solid #8193a4; }
.cost-fraction strong { font-weight:600; }
.question-intro .delegation-formula > p, .delegation-formula > p { margin:0; font-size:11px; color:#5c6875; line-height:1.6; }
@media(max-width:650px) {
 .delegation-formula { padding:14px 12px 12px; }
 .cost-fraction { font-size:21px; }
 .formula-heading h2 { font-size:11px; }
 .formula-heading a { font-size:10px; }
}

/* Short annotations keep the mosaic itself free of explanatory prose. */
.question-intro .author-credit { font-size:13px; color:#596574; margin:0 0 17px; }
.mosaic-footer { justify-content:flex-end; gap:3px; margin:2px 0 0; }
.annotation-marker { min-width:36px; min-height:32px; padding:3px 7px; border:0; background:transparent; font-size:17px; color:#4c627d; }
.annotation-callout { width:min(500px,calc(100vw - 32px)); padding:24px; border:1px solid #cad3dd; border-radius:9px; color:var(--ink); box-shadow:0 18px 70px #15263a30; }
.annotation-callout::backdrop { background:#15263a45; }
.annotation-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:17px; }
.annotation-heading h2 { margin:0; font-size:20px; }
.annotation-heading button { min-height:34px; font-size:12px; padding:5px 10px; }
.annotation-callout p { font-size:14px; line-height:1.65; }
.annotation-callout p:last-child { margin-bottom:0; font-size:12px; }

.quantification { margin:0 0 24px; border:1px solid #ccd7e2; border-top:3px solid #63829c; padding:22px 28px 0; background:linear-gradient(115deg,#f4f8fa,#fdfaf9); }
.quantification > .eyebrow { margin:0 0 8px; color:#49657b; }
.quant-heading { display:flex; justify-content:space-between; align-items:baseline; gap:15px; }
.quant-heading h3 { font-size:19px; font-weight:550; margin:0; }
.quant-heading > span { font-size:11px; color:var(--muted); }
.quant-readouts { display:grid; grid-template-columns:1fr 1fr 1.3fr; margin:20px 0 17px; }
.quant-cell { padding:0 20px; border-left:1px solid #d9e0e5; }
.quant-cell:first-child { padding-left:0; border:0; }
.quant-cell:last-child { padding-right:0; }
.quant-cell > span { display:block; font-size:12px; color:#526173; margin-bottom:5px; }
.quant-cell strong { display:block; font-size:32px; font-weight:550; letter-spacing:-.8px; font-variant-numeric:tabular-nums; line-height:1.3; }
.quant-cell small { display:block; font-size:11px; margin-top:5px; }
.quant-benefit strong { color:#2c685c; }
.quant-cost strong { color:#814a57; }
.quant-verdict { margin:0 0 8px; font-size:13px; max-width:900px; }
.quantification > .evidence-footnote { max-width:1050px; margin:0 0 17px; }
.quant-loss { display:flex; align-items:center; justify-content:space-between; gap:20px; border-top:1px solid #d9e0e5; padding:16px 0; }
.quant-loss .eyebrow { font-size:10px; }
.quant-loss p { margin:4px 0; font-size:12px; }
.quant-loss strong { font-size:20px; font-weight:550; margin-right:9px; }
.quant-loss small { font-size:11px; }
.quant-loss button { flex-shrink:0; }
.quant-unknown { border-top:1px solid #d9e0e5; padding-top:13px; margin:0 0 13px; color:#596574; font-size:12px; }
.quant-net { padding:12px 28px; margin:0 -28px; font-size:12px; background:#eaf0f4; color:#45596c; }
.quant-net strong { color:#273e52; }
@media(max-width:650px) {
 .quantification { padding:18px 18px 0; }
 .quant-heading { display:block; }
 .quant-heading > span { display:block; margin-top:5px; }
 .quant-readouts { grid-template-columns:1fr 1fr; gap:18px 0; }
 .quant-cell { padding:0 0 0 16px; }
 .quant-cell:last-child { grid-column:1/-1; border-left:0; border-top:1px solid #d9e0e5; padding:14px 0 0; }
 .quant-cell strong { font-size:27px; }
 .quant-loss { flex-direction:column; align-items:flex-start; gap:12px; }
 .quant-net { margin:0 -18px; padding:12px 18px; }
}
