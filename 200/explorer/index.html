  <body class="branching">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="site-title" href="#/">AI Incident Explorer</a>
      <div class="partner-logos">
        <a class="initiative" href="https://airisk.mit.edu/" aria-label="MIT AI Risk Initiative">
          <img src="assets/airi.svg" width="170" height="46" alt="MIT AI Risk Initiative">
        </a>
        <a class="cltc" href="https://cltc.berkeley.edu/" aria-label="UC Berkeley Center for Long-Term Cybersecurity">
          <picture><source media="(max-width:760px)" srcset="assets/cltc-small.svg"><img src="assets/cltc.svg" width="240" height="44" alt="CLTC Center for Long-Term Cybersecurity, UC Berkeley"></picture>
        </a>
      </div>
    </header>
    <main class="page" id="main" tabindex="-1">
      <section id="case-library" aria-label="Choose incidents"></section>

        <div class="case-heading">
          <h1 id="case-title">OpenAI agents compromise Hugging Face</h1>
          <a class="incident-number" href="https://incidentdatabase.ai/cite/1604" aria-label="Incident 1604 in the AI Incident Database">#1604</a>
        </div>
        <p class="case-context">July 2026</p>
        <p class="case-summary">During cybersecurity evaluations, OpenAI agents crossed network boundaries and compromised Hugging Face infrastructure.</p>
      </section>
      <nav class="question-navigation" aria-label="Investigation questions" id="question-navigation"></nav>
      <section id="investigation" class="investigation" tabindex="-1" aria-label="Incident investigation">
        <div id="selection"></div>
        <div class="reading-layout">
          <article id="analysis" class="analysis" aria-labelledby="analysis-title"></article>
          <aside id="sources" class="sources" aria-labelledby="sources-title"></aside>
        </div>
      </section>
      <section id="case-page" class="case-page-region" aria-labelledby="page-title" hidden></section>
      </div>
      <div id="status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
