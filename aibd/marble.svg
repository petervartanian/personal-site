<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="m" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceGraphic" stdDeviation="26" result="soft"/>
<feTurbulence type="turbulence" baseFrequency="0.0021 0.011" numOctaves="4" seed="17" result="t1"/>
<feDisplacementMap in="soft" in2="t1" scale="360" xChannelSelector="R" yChannelSelector="G" result="d1"/>
<feTurbulence type="fractalNoise" baseFrequency="0.008 0.0035" numOctaves="3" seed="5" result="t2"/>
<feDisplacementMap in="d1" in2="t2" scale="170" xChannelSelector="G" yChannelSelector="B" result="d2"/>
<feTurbulence type="turbulence" baseFrequency="0.045 0.010" numOctaves="2" seed="23" result="t3"/>
<feDisplacementMap in="d2" in2="t3" scale="46" xChannelSelector="B" yChannelSelector="R" result="d3"/>
<feColorMatrix in="d3" type="saturate" values="0.55"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="g"/>
<feColorMatrix in="g" type="saturate" values="0" result="gs"/>
<feComponentTransfer in="gs"><feFuncA type="linear" slope="0.16" intercept="0"/></feComponentTransfer>
</filter>
</defs>
<g filter="url(#m)">
<rect x="-400" y="-400" width="2400" height="1800" fill="#d6d0c3"/>
<ellipse cx="160" cy="120" rx="470" ry="250" fill="#94a3b8" opacity="0.8"/>
