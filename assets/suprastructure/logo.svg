<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256"><title>The Suprastructure overprint mark</title><desc>Three angular bands form an open assembly. Cyan and magenta cross to make blue; yellow crossing the lower arms makes green and vermilion.</desc><rect width="256" height="256" fill="#fff"/><g transform="translate(128 128) scale(0.88734968619488319) translate(-128 -124)" style="isolation:isolate"><rect width="256" height="256" fill="#fff"/><path d="M26 22H66L230 186V226H190L26 62Z" fill="#00bfea" style="mix-blend-mode:multiply"/><path d="M26 186 190 22H230V62L66 226H26Z" fill="#ff2da8" style="mix-blend-mode:multiply"/><path d="M26 186H230V226H26Z" fill="#ffe500" style="mix-blend-mode:multiply"/></g></svg>